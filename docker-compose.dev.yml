name: dastyare_social_sh

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ds-sh-dev:latest
    ports:
      - "2947:2947"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
    restart: unless-stopped
    command: sh -c "bun run db:migrate && bun run bootstrap:admin && bun run dev"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dastyare_social_sh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
