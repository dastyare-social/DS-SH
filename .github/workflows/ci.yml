name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dastyare_social_sh
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dastyare_social_sh"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dastyare_social_sh
      BETTER_AUTH_URL: http://localhost:2947
      BETTER_AUTH_SECRET: ci-test-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
      API_KEY: ci-test-api-key
      API_KEY_RATE_LIMIT_MAX_REQUESTS: "30"
      API_KEY_RATE_LIMIT_WINDOW_MS: "60000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Run migrations
        run: bun run db:migrate

      - name: Bootstrap admin
        run: bun run bootstrap:admin

      - name: Build application
        run: bunx next build
